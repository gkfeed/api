name: API contract

on:
  pull_request:
    branches: [v1]
  push:
    branches: [v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and validate Swagger 2.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Generate, test, vet and validate
        run: env -u GKFEED_TEST_DATABASE_URL make check
      - name: Build API
        run: env -u GKFEED_TEST_DATABASE_URL CGO_ENABLED=0 GOOS=linux make build
      - name: Compare contracts with the merge base
        id: compatibility
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/swagger-diff.sh "$(git merge-base HEAD "$BASE_SHA")"
      - name: Publish compatibility summary
        if: always() && steps.compatibility.outcome != 'skipped' && github.event_name == 'pull_request'
        env:
          COMPARISON_OUTCOME: ${{ steps.compatibility.outcome }}
        run: |
          {
            printf '### Swagger compatibility\n\nComparison outcome: %s. Advisory during baseline adoption.\n\n' "$COMPARISON_OUTCOME"
            printf 'Review the swagger artifact for both contracts and the complete report.\n\n'
            if [ -f .cache/swagger-report/breaking.txt ]; then
              printf '```text\n'
              head -c 20000 .cache/swagger-report/breaking.txt
              printf '\n```\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Swagger exports and compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/cmd/api/docs/swagger.json
            app/cmd/api/docs/swagger.yaml
            .cache/swagger-report/
          include-hidden-files: true
          if-no-files-found: error
