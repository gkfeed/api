name: API contract

on:
  pull_request:
    branches: [v1]
  push:
    branches: [v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and validate Swagger 2.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Check and build
        run: |
          env -u GKFEED_TEST_DATABASE_URL make check
          env -u GKFEED_TEST_DATABASE_URL CGO_ENABLED=0 GOOS=linux make build
      - name: Compare contracts with the merge base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/swagger-diff.sh "$(git merge-base HEAD "$BASE_SHA")"
      - name: Upload Swagger exports and compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/cmd/api/docs/swagger.json
            app/cmd/api/docs/swagger.yaml
            .cache/swagger-report/
          include-hidden-files: true
          if-no-files-found: error
