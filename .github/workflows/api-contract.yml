name: API contract

on:
  pull_request:
    branches: [v1]
  push:
    branches: [v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and validate Swagger 2.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Check and build
        run: |
          env -u GKFEED_TEST_DATABASE_URL make check
          env -u GKFEED_TEST_DATABASE_URL CGO_ENABLED=0 GOOS=linux make build
      - name: Upload Swagger exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-${{ github.sha }}
          path: app/cmd/api/docs/swagger.*
          if-no-files-found: error
