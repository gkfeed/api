services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      GKFEED_ADDRESS: ":8086"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GKFEED_DATABASE_URL: "${GKFEED_DATABASE_URL:?set GKFEED_DATABASE_URL to the PostgreSQL application connection URL}"
      # Empty optional values keep Config.Load defaults and sync-key fallback.
      GKFEED_ALLOWED_ORIGINS: "${GKFEED_ALLOWED_ORIGINS:-}"
      GKFEED_SYNC_CURSOR_SECRET: "${GKFEED_SYNC_CURSOR_SECRET:-}"
      GKFEED_JWT_SECRET: "${GKFEED_JWT_SECRET:-}"
      GKFEED_WEBAUTHN_RP_ID: "${GKFEED_WEBAUTHN_RP_ID:-}"
      GKFEED_WEBAUTHN_RP_ORIGIN: "${GKFEED_WEBAUTHN_RP_ORIGIN:-}"
      GKFEED_WEBAUTHN_RP_DISPLAY: "${GKFEED_WEBAUTHN_RP_DISPLAY:-}"
      GKFEED_ACCESS_TTL: "${GKFEED_ACCESS_TTL:-}"
      GKFEED_JWT_REFRESH_TTL: "${GKFEED_JWT_REFRESH_TTL:-}"
    restart: always
