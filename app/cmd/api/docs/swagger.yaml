definitions:
  handlers.ResourceError:
    properties:
      error:
        enum:
        - invalid_id
        - unauthorized
        - not_found
        - internal_error
        - method_not_allowed
        example: not_found
        type: string
      message:
        example: Resource not found
        type: string
    required:
    - error
    - message
    type: object
  handlers.createFeedDTO:
    properties:
      title:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  handlers.createFeedsDTO:
    properties:
      title:
        type: string
      type:
        type: string
      types:
        items:
          type: string
        type: array
      url:
        type: string
    required:
    - url
    type: object
  handlers.feedCreationError:
    properties:
      error:
        properties:
          code:
            type: string
          message:
            type: string
        type: object
    type: object
  handlers.feedCreationResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/handlers.feedMutationResponse'
        type: array
    type: object
  handlers.feedDTO:
    properties:
      id:
        type: integer
      title:
        type: string
      type:
        type: string
      url:
        type: string
      userid:
        type: integer
    type: object
  handlers.feedMutationResponse:
    properties:
      created:
        type: boolean
      item:
        $ref: '#/definitions/handlers.feedDTO'
    type: object
  handlers.getItemResponse:
    properties:
      feed:
        $ref: '#/definitions/handlers.feedDTO'
      item:
        $ref: '#/definitions/handlers.itemDTO'
    type: object
  handlers.getItemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.itemDTO'
        type: array
      next_cursor:
        type: integer
    type: object
  handlers.itemChangesResponse:
    properties:
      deleted_ids:
        items:
          type: integer
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
      upserted:
        items:
          $ref: '#/definitions/handlers.itemDTO'
        type: array
    type: object
  handlers.itemDTO:
    properties:
      date:
        type: string
      feed_id:
        type: integer
      id:
        type: integer
      link:
        type: string
      text:
        type: string
      title:
        type: string
    type: object
  handlers.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handlers.refreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handlers.registerBeginRequest:
    properties:
      name:
        type: string
    type: object
  handlers.syncItemsResponse:
    properties:
      has_more:
        type: boolean
      items:
        items:
          $ref: '#/definitions/handlers.itemDTO'
        type: array
      next_cursor:
        type: string
      sync_cursor:
        type: string
    type: object
  handlers.tokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  models.User:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
info:
  contact:
    name: GKFeed
    url: https://github.com/gkfeed/api-go
  description: RSS feed aggregator with passkey authentication.
  title: GKFeed API
  version: '2.0'
paths:
  /api/v1/add:
    post:
      consumes:
      - application/json
      description: Adds a new RSS/YouTube/TikTok feed for the authenticated user.
      parameters:
      - description: Feed to add (title, type, url)
        in: body
        name: feed
        required: true
        schema:
          $ref: '#/definitions/handlers.createFeedDTO'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/handlers.feedMutationResponse'
        '400':
          description: ''
        '401':
          description: ''
        '500':
          description: ''
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Add feed
      tags:
      - feeds
  /api/v1/add_deleted_items:
    post:
      description: Gone. Use DELETE /api/v1/items/{id} instead.
      produces:
      - application/json
      responses:
        '401':
          description: ''
        '410':
          description: Gone
          schema:
            allOf:
            - type: object
            - properties:
                error:
                  type: string
                replacement:
                  type: string
              type: object
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Deprecated item hide endpoint
      tags:
      - items
  /api/v1/add_lazy:
    post:
      consumes:
      - application/json
      description: Creates a feed by parsing the URL and detecting the source type
        (YouTube, TikTok, Rezka, etc.).
      parameters:
      - description: URL to create feed from
        in: body
        name: feed
        required: true
        schema:
          allOf:
          - type: object
          - properties:
              url:
                type: string
            type: object
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/handlers.feedMutationResponse'
        '400':
          description: ''
        '401':
          description: ''
        '500':
          description: ''
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Add feed by URL
      tags:
      - feeds
  /api/v1/auth/credentials:
    get:
      description: Returns all registered passkeys for the authenticated user.
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              properties:
                created_at:
                  type: string
                id:
                  type: string
                last_used_at:
                  type: string
                name:
                  type: string
              type: object
            type: array
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: List passkeys
      tags:
      - auth
  /api/v1/auth/credentials/{id}:
    delete:
      description: Removes a specific passkey credential for the authenticated user.
      parameters:
      - description: Credential ID (base64url)
        in: path
        name: id
        required: true
        type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Delete passkey
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Exchanges username and password for a short-lived access token
        and a rotating refresh token.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/handlers.tokenResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
      summary: Login with a password
      tags:
      - auth
  /api/v1/auth/login/begin:
    post:
      description: Starts discoverable WebAuthn login, returns assertion options for
        the browser.
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '500':
          description: Internal Server Error
      summary: Begin passkey login
      tags:
      - auth
  /api/v1/auth/login/finish:
    post:
      consumes:
      - application/json
      description: Completes WebAuthn authentication, returns an access/refresh token
        pair.
      parameters:
      - description: WebAuthn assertion response
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            properties:
              access_token:
                type: string
              credential_id:
                type: string
              refresh_token:
                type: string
            type: object
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Finish passkey login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the refresh-token family associated with the supplied token.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.refreshRequest'
      produces:
      - application/json
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Logout
      tags:
      - auth
  /api/v1/auth/logout-all:
    post:
      description: Revokes every refresh token and access session for the authenticated
        user.
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Logout all sessions
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user's ID and name.
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            properties:
              id:
                type: integer
              name:
                type: string
            type: object
        '401':
          description: Unauthorized
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates a refresh token and returns a new access/refresh token
        pair.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.refreshRequest'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/handlers.tokenResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
      summary: Refresh access token
      tags:
      - auth
  /api/v1/auth/register/begin:
    post:
      consumes:
      - application/json
      description: Starts WebAuthn registration, returns creation options for the
        browser.
      parameters:
      - description: Optional name for the passkey
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.registerBeginRequest'
      produces:
      - application/json
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Begin passkey registration
      tags:
      - auth
  /api/v1/auth/register/finish:
    post:
      consumes:
      - application/json
      description: Completes WebAuthn registration with the attestation response from
        the browser.
      parameters:
      - description: WebAuthn attestation response
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            properties:
              id:
                type: string
              name:
                type: string
            type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Finish passkey registration
      tags:
      - auth
  /api/v1/delete:
    delete:
      description: Deletes a feed by ID. Only the feed owner can delete it.
      parameters:
      - description: Feed ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        '204':
          description: ''
        '400':
          description: ''
        '401':
          description: ''
        '404':
          description: ''
        '500':
          description: ''
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Delete feed
      tags:
      - feeds
  /api/v1/feed:
    get:
      description: Returns all user items as an RSS 2.0 XML feed.
      produces:
      - application/rss+xml
      responses:
        '200':
          description: ''
        '401':
          description: ''
        '500':
          description: ''
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Get RSS feed
      tags:
      - feeds
  /api/v1/feed_types:
    get:
      description: Returns all feed type identifiers supported by the parser.
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: List feed types
      tags:
      - feeds
  /api/v1/get_items:
    get:
      description: Returns paginated items for the authenticated user. Supports cursor-based
        pagination.
      parameters:
      - description: Items per page (default 100)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor (item ID)
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/handlers.getItemsResponse'
        '400':
          description: ''
        '401':
          description: ''
        '500':
          description: ''
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Get items
      tags:
      - items
  /api/v1/item:
    get:
      description: Returns a single item with its parent feed for the authenticated
        user.
      parameters:
      - description: Item ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - type: object
            - properties:
                feed:
                  type: object
                item:
                  type: object
              type: object
        '400':
          description: ''
        '401':
          description: ''
        '404':
          description: ''
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Get item by ID
      tags:
      - items
  /api/v1/items/{id}:
    delete:
      description: Permanently deletes an item owned by the authenticated user.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        '204':
          description: ''
        '400':
          description: ''
        '401':
          description: ''
        '404':
          description: ''
        '500':
          description: ''
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Delete item
      tags:
      - items
  /api/v1/list:
    get:
      description: Returns all feeds for the authenticated user.
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              type: object
            type: array
        '401':
          description: ''
        '500':
          description: ''
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: List feeds
      tags:
      - feeds
  /api/v2/feeds:
    get:
      description: Returns the authenticated user's feeds. An empty list is returned
        as [].
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.feedDTO'
            type: array
        "401":
          description: 'unauthorized: missing or invalid credentials'
          headers:
            WWW-Authenticate:
              description: Basic authentication challenge for realm Restricted
              type: string
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "405":
          description: 'method_not_allowed: use GET or POST on this path'
          headers:
            Allow:
              description: GET, POST
              type: string
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "500":
          description: 'internal_error: request failed'
          schema:
            $ref: '#/definitions/handlers.ResourceError'
      security:
      - BasicAuth: []
      - BearerAuth: []
      - BrowserSession: []
      summary: List feeds
      tags:
      - feeds
    post:
      consumes:
      - application/json
      description: Resolves missing metadata and creates all selected subscriptions
        atomically. Explicit type or types overrides automatic selection. Repeats
        return existing feeds without changing them.
      parameters:
      - description: One source URL, optional title and either type or types
        in: body
        name: feed
        required: true
        schema:
          $ref: '#/definitions/handlers.createFeedsDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.feedCreationResponse'
        "400":
          description: ""
        "401":
          description: ""
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.feedCreationError'
        "500":
          description: ""
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.feedCreationError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.feedCreationError'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/handlers.feedCreationError'
      security:
      - BasicAuth: []
      - BearerAuth: []
      - BrowserSession: []
      summary: Create subscriptions from a source URL
      tags:
      - feeds
  /api/v2/feeds/{id}:
    delete:
      description: Deletes an owned feed and all its items. Missing, foreign, and
        previously deleted IDs all return 404. Authentication is checked before the
        ID.
      parameters:
      - description: Positive feed ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - text/plain
      responses:
        "204":
          description: Deleted; response body is empty
        "400":
          description: 'invalid_id: ID must be a positive integer within the server''s
            integer range'
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "401":
          description: 'unauthorized: missing or invalid credentials'
          headers:
            WWW-Authenticate:
              description: Basic authentication challenge for realm Restricted
              type: string
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "403":
          description: Browser-session Origin policy rejected the request; response
            is text/plain
          schema:
            type: string
        "404":
          description: 'not_found: feed is missing or belongs to another user'
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "405":
          description: 'method_not_allowed: use GET or DELETE on this path'
          headers:
            Allow:
              description: GET, DELETE
              type: string
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "500":
          description: 'internal_error: request failed'
          schema:
            $ref: '#/definitions/handlers.ResourceError'
      security:
      - BasicAuth: []
      - BearerAuth: []
      - BrowserSession: []
      summary: Delete feed by ID
      tags:
      - feeds
    get:
      description: Returns an owned feed with the same fields as a feed list entry.
        Missing and foreign IDs both return 404. Authentication is checked before
        the ID.
      parameters:
      - description: Positive feed ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.feedDTO'
        "400":
          description: 'invalid_id: ID must be a positive integer within the server''s
            integer range'
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "401":
          description: 'unauthorized: missing or invalid credentials'
          headers:
            WWW-Authenticate:
              description: Basic authentication challenge for realm Restricted
              type: string
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "404":
          description: 'not_found: feed is missing or belongs to another user'
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "405":
          description: 'method_not_allowed: use GET or DELETE on this path'
          headers:
            Allow:
              description: GET, DELETE
              type: string
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "500":
          description: 'internal_error: request failed'
          schema:
            $ref: '#/definitions/handlers.ResourceError'
      security:
      - BasicAuth: []
      - BearerAuth: []
      - BrowserSession: []
      summary: Get feed by ID
      tags:
      - feeds
  /api/v2/items:
    get:
      description: Returns paginated items for the authenticated user. Supports cursor-based
        pagination.
      parameters:
      - description: Items per page (default 100)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor (item ID)
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/handlers.getItemsResponse'
        '400':
          description: ''
        '401':
          description: ''
        '500':
          description: ''
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Get items
      tags:
      - items
  /api/v2/items/changes:
    get:
      description: Returns item mutations after a sync cursor. Apply each response
        before using its next cursor.
      parameters:
      - description: Changes per page (default 100, maximum 500)
        in: query
        name: limit
        type: integer
      - description: Opaque sync cursor
        in: query
        name: cursor
        required: true
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/handlers.itemChangesResponse'
        '400':
          description: ''
        '401':
          description: ''
        '500':
          description: ''
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Get item changes
      tags:
      - items
  /api/v2/items/sync:
    get:
      description: Returns a bounded item page and a sync cursor for later changes.
      parameters:
      - description: Items per page (default 100, maximum 500)
        in: query
        name: limit
        type: integer
      - description: Opaque page cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/handlers.syncItemsResponse'
        '400':
          description: ''
        '401':
          description: ''
        '500':
          description: ''
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: List items for synchronization
      tags:
      - items
  /api/v2/items/{id}:
    delete:
      description: Permanently deletes an owned item. Missing, foreign, and previously
        deleted IDs all return 404. Authentication is checked before the ID.
      parameters:
      - description: Positive item ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      - text/plain
      responses:
        "204":
          description: Deleted; response body is empty
        "400":
          description: 'invalid_id: ID must be a positive integer within the server''s
            integer range'
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "401":
          description: 'unauthorized: missing or invalid credentials'
          headers:
            WWW-Authenticate:
              description: Basic authentication challenge for realm Restricted
              type: string
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "403":
          description: Browser-session Origin policy rejected the request; response
            is text/plain
          schema:
            type: string
        "404":
          description: 'not_found: item is missing or belongs to another user'
          schema:
            $ref: '#/definitions/handlers.ResourceError'
        "405":
          description: 'method_not_allowed: use GET or DELETE on this path'
          headers:
            Allow:
              description: GET, DELETE
              type: string
